<head>

<style>

#settingsCard{background:linear-gradient(180deg,#1e293b,#0f172a);padding:28px 24px;border-radius:16px;width:340px;box-shadow:0 12px 40px rgba(0,0,0,0.8);border:1px solid rgba(255,255,255,0.08);color:#e2e8f0;text-align:center}

<body>

<canvas id="game"></canvas>

<div id="legend"></div>

<div id="lobby"><div class="card"><h1>لوبي اللعبة</h1><div id="telegramTag">@Z_S_T_O</div><label>عدد اللاعبين</label><select id="playerCount"><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option></select><label>معدل الإنتاج</label><input id="prodRate" type="range" min="300" max="2000" value="900"><button id="startBtn" class="green" style="width:100%">ابدأ</button><button id="onlineBtnLocal" class="green" style="width:100%;background:#06b6d4;margin-top:8px">اونلاين (غرف)</button></div></div>

<div id="onlinePage" style="display:none;position:fixed;inset:0;z-index:3000;background:linear-gradient(180deg,#0d1117,#071022);color:#e6eef8;overflow:auto;padding:36px 12px"><div style="max-width:840px;margin:0 auto"><button id="onlineBack" style="background:#111827;color:white;padding:8px 12px;border-radius:10px;cursor:pointer">رجوع</button><h1 style="text-align:center;margin:18px 0">اونلاين</h1><div style="display:grid;grid-template-columns:1fr 1fr;gap:18px"><div style="background:rgba(6,10,18,0.7);padding:18px;border-radius:12px"><h2>إنشاء</h2><input id="roomName" placeholder="اسم الغرفة"><select id="roomMax"><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option></select><button id="createRoom" class="green" style="width:100%">إنشاء</button><button id="startRoom" style="width:100%;background:#10b981;color:#fff;border-radius:8px;cursor:pointer;margin-top:6px">بدء</button></div><div style="background:rgba(6,10,18,0.7);padding:18px;border-radius:12px"><h2>انضمام</h2><input id="joinCode" placeholder="رمز الغرفة"><button id="joinRoom" class="green" style="width:100%">انضمام</button><h3>اللاعبين</h3><ul id="playerList" style="list-style:none;padding:0;color:#dbeafe"></ul></div></div></div></div>

<script>
var grid=[];
document.addEventListener('DOMContentLoaded',()=>{
'use strict';
const HEX=34,DEFEND_RADIUS=HEX*3.2,CAPITAL_DEFENSE_DISTANCE=2,COINS_PER_CELL=10;
const gameCanvas=document.getElementById('game');
const ratioSlider=document.getElementById('ratioSlider'),ratioValue=document.getElementById('ratioValue'),startBtn=document.getElementById('startBtn');
const playerCount=document.getElementById('playerCount'),prodRate=document.getElementById('prodRate'),legendEl=document.getElementById('legend');
const mainMenuBtn=document.getElementById('mainMenuBtn'),victoryOverlay=document.getElementById('victoryOverlay');
const victoryText=document.getElementById('victoryText'),victorName=document.getElementById('victorName'),victoryToLobby=document.getElementById('victoryToLobby');
const lbBtn=document.getElementById('leaderboardBtn'),lbPanel=document.getElementById('leaderboardPanel'),lbContent=document.getElementById('lbContent');
const coinDisplay=document.getElementById('coinDisplay'),coinAmount=document.getElementById('coinAmount'),coinRate=document.getElementById('coinRate');
const buildPanel=document.getElementById('buildPanel'),buildOptions=document.getElementById('buildOptions');
const launchPanel=document.getElementById('launchPanel'),launchBtn=document.getElementById('launchBtn');
const dbg=document.getElementById('dbg');

const musicToggleBtn=document.getElementById('musicToggleBtn');
const settingsBtn=document.getElementById('settingsBtn');
const settingsPage=document.getElementById('settingsPage');
const settingsBackBtn=document.getElementById('settingsBackBtn');

let musicOn=false;
let bgMusic=null;
let audioUnlocked=false;

// فتح AudioContext عند أول نقرة - الحيلة الذهبية
function unlockAudio(){
  if(audioUnlocked) return;
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx) return;
  try{
    const ctx=new AudioCtx();
    const buf=ctx.createBuffer(1,1,22050);
    const src=ctx.createBufferSource();
    src.buffer=buf;
    src.connect(ctx.destination);
    src.start(0);
    audioUnlocked=true;
    // الآن نشغل الموسيقى إذا كانت مفعلة
    if(musicOn && bgMusic){
      bgMusic.play().catch(()=>{});
    }
  }catch(e){}
  document.removeEventListener('click',unlockAudio);
  document.removeEventListener('touchstart',unlockAudio);
}

document.addEventListener('click',unlockAudio);
document.addEventListener('touchstart',unlockAudio);

// إنشاء عنصر الصوت
function createAudio(){
  if(bgMusic) return bgMusic;
  bgMusic=new Audio();
  bgMusic.loop=true;
  bgMusic.volume=0.4;
  bgMusic.preload='auto';
  bgMusic.src='https://cdn.pixabay.com/audio/2022/10/25/audio_946f6d7c64.mp3';
  bgMusic.load();
  document.body.appendChild(bgMusic);
  return bgMusic;
}

// دالة تشغيل/إيقاف الموسيقى
window.toggleMusic=function(){
  if(!bgMusic) createAudio();
  if(musicOn){
    bgMusic.pause();
    musicOn=false;
    musicToggleBtn.textContent='🔇 إيقاف الموسيقى';
    musicToggleBtn.className='music-off';
  } else {
    musicOn=true;
    if(audioUnlocked){
      bgMusic.play().then(()=>{
        musicToggleBtn.textContent='🎵 تشغيل الموسيقى';
        musicToggleBtn.className='music-on';
      }).catch(()=>{
        musicOn=false;
        musicToggleBtn.textContent='⚠️ خطأ';
        musicToggleBtn.className='music-off';
      });
    } else {
      // إذا ما بعد تم فتح الصوت، نخلي الزر أخضر وننتظر النقرة
      musicToggleBtn.textContent='🎵 تشغيل الموسيقى';
      musicToggleBtn.className='music-on';
    }
  }
};

// بدء الموسيقى مع بدء اللعبة
function startMusic(){
  if(!bgMusic) createAudio();
  musicOn=true;
  musicToggleBtn.textContent='🎵 تشغيل الموسيقى';
  musicToggleBtn.className='music-on';
  if(audioUnlocked && bgMusic){
    bgMusic.currentTime=0;
    bgMusic.play().catch(()=>{});
  }
}

settingsBtn.addEventListener('click',(e)=>{
  e.stopPropagation();
  settingsPage.style.display='flex';
});

settingsBackBtn.addEventListener('click',(e)=>{
  e.stopPropagation();
  settingsPage.style.display='none';
});

if(!gameCanvas){ dbg.style.display='block'; dbg.textContent='Error'; return; }
const ctx=gameCanvas.getContext('2d');
if(!ctx){ dbg.style.display='block'; dbg.textContent='Error'; return; }

let W=0,H=0,needRender=true,frameId=null;
function resize(){ W=gameCanvas.width=window.innerWidth||300; H=gameCanvas.height=window.innerHeight||200; needRender=true; }
window.addEventListener('resize',resize); resize();

var players=[],cam={x:0,y:0,scale:1,targetScale:1},selected=null,prodTimer=null,botTimer=null,coinTimer=null;
var dragging=false,lastX=0,lastY=0,gameStarted=false,botTickCounter=0,playerCoins=0,playerCellCount=0;
var launchMode=false,missileLauncherCell=null,missiles=[],cellFires=[],interceptorMissiles=[],botCoins={};
var lastBotMissileTime=0,botMissileInterval=10000;
var wallLevel=0;
var interceptHits={};
var missileNeeds={};
var wallCheckInterval=null;

// إعادة استخدام AudioContext المفتوح سابقاً
function getAudioCtx(){
  return window.AudioContext?new(window.AudioContext||window.webkitAudioContext)():null;
}

function playMissileLaunchSound(){ const actx=getAudioCtx(); if(!actx) return; const now=actx.currentTime; for(let i=0;i<3;i++){ const o=actx.createOscillator(),g=actx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(60+i*25,now); o.frequency.linearRampToValueAtTime(250+i*50,now+1); g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(0.12,now+0.15); g.gain.exponentialRampToValueAtTime(0.0001,now+1.5); o.connect(g); g.connect(actx.destination); o.start(now); o.stop(now+1.6); } setTimeout(()=>{ const o=actx.createOscillator(),g=actx.createGain(); o.type='sine'; o.frequency.setValueAtTime(800,actx.currentTime); o.frequency.linearRampToValueAtTime(1500,actx.currentTime+0.6); g.gain.setValueAtTime(0.0001,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.07,actx.currentTime+0.1); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.7); o.connect(g); g.connect(actx.destination); o.start(actx.currentTime); o.stop(actx.currentTime+0.8); },500); }
function playExplosionSound(){ const actx=getAudioCtx(); if(!actx) return; const now=actx.currentTime; for(let i=0;i<5;i++){ const o=actx.createOscillator(),g=actx.createGain(); o.type='square'; o.frequency.setValueAtTime(25+i*12,now); o.frequency.exponentialRampToValueAtTime(4,now+1.2); g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(0.18,now+0.06); g.gain.exponentialRampToValueAtTime(0.0001,now+1.4); o.connect(g); g.connect(actx.destination); o.start(now); o.stop(now+1.5); } const bo=actx.createOscillator(),bg=actx.createGain(); bo.type='sine'; bo.frequency.setValueAtTime(12,now); bo.frequency.exponentialRampToValueAtTime(3,now+1.8); bg.gain.setValueAtTime(0.0001,now); bg.gain.exponentialRampToValueAtTime(0.3,now+0.04); bg.gain.exponentialRampToValueAtTime(0.0001,now+1.8); bo.connect(bg); bg.connect(actx.destination); bo.start(now); bo.stop(now+2); setTimeout(()=>{ for(let i=0;i<8;i++){ const o=actx.createOscillator(),g=actx.createGain(); o.type='triangle'; o.frequency.setValueAtTime(150+Math.random()*600,actx.currentTime); g.gain.setValueAtTime(0.0001,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.05,actx.currentTime+0.03); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.4); o.connect(g); g.connect(actx.destination); o.start(actx.currentTime); o.stop(actx.currentTime+0.5); } },250); }
function playInterceptorSound(){ const actx=getAudioCtx(); if(!actx) return; const o=actx.createOscillator(),g=actx.createGain(); o.type='sine'; o.frequency.setValueAtTime(1000,actx.currentTime); o.frequency.linearRampToValueAtTime(2000,actx.currentTime+0.3); g.gain.setValueAtTime(0.0001,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.1,actx.currentTime+0.05); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.35); o.connect(g); g.connect(actx.destination); o.start(actx.currentTime); o.stop(actx.currentTime+0.4); }
function playInterceptExplosionSound(){ const actx=getAudioCtx(); if(!actx) return; const o=actx.createOscillator(),g=actx.createGain(); o.type='square'; o.frequency.setValueAtTime(40,actx.currentTime); o.frequency.exponentialRampToValueAtTime(5,actx.currentTime+0.5); g.gain.setValueAtTime(0.0001,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.15,actx.currentTime+0.03); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.6); o.connect(g); g.connect(actx.destination); o.start(actx.currentTime); o.stop(actx.currentTime+0.7); }
function playBuildSound(){ const actx=getAudioCtx(); if(!actx) return; const o=actx.createOscillator(),g=actx.createGain(); o.type='sine'; o.frequency.setValueAtTime(440,actx.currentTime); g.gain.setValueAtTime(0.0001,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.08,actx.currentTime+0.05); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.3); o.connect(g); g.connect(actx.destination); o.start(actx.currentTime); o.stop(actx.currentTime+0.35); }
function playWallUpgradeSound(){ const actx=getAudioCtx(); if(!actx) return; const o=actx.createOscillator(),g=actx.createGain(); o.type='triangle'; o.frequency.setValueAtTime(300,actx.currentTime); o.frequency.linearRampToValueAtTime(600,actx.currentTime+0.5); g.gain.setValueAtTime(0.0001,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.1,actx.currentTime+0.1); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.6); o.connect(g); g.connect(actx.destination); o.start(actx.currentTime); o.stop(actx.currentTime+0.7); }

function isConnectedToMainBorder(idx, visited, mainBorderCells){
  if(mainBorderCells.has(idx)) return true;
  if(visited.has(idx)) return false;
  if(grid[idx].owner!==0) return false;
  visited.add(idx);
  for(const ni of grid[idx].neighbors){
    if(isConnectedToMainBorder(ni, visited, mainBorderCells)) return true;
  }
  return false;
}

function findMainBorderCells(){
  const playerCells = [];
  for(let i=0;i<grid.length;i++){ if(grid[i].owner===0) playerCells.push(i); }
  if(playerCells.length===0) return new Set();
  const capital = players[0]?.capital;
  if(capital===null||capital===undefined) return new Set();
  const mainGroup = new Set();
  const queue = [capital];
  mainGroup.add(capital);
  while(queue.length>0){
    const cur = queue.shift();
    for(const ni of grid[cur].neighbors){
      if(grid[ni]&&grid[ni].owner===0&&!mainGroup.has(ni)){ mainGroup.add(ni); queue.push(ni); }
    }
  }
  const mainBorderCells = new Set();
  for(const idx of mainGroup){
    for(const ni of grid[idx].neighbors){
      if(grid[ni]&&grid[ni].owner!==0){ mainBorderCells.add(idx); break; }
    }
  }
  return mainBorderCells;
}

function applyWallToBorders(){
  if(wallLevel===0){ for(let i=0;i<grid.length;i++){ if(grid[i].owner===0) grid[i].wall=false; } return; }
  const mainBorderCells = findMainBorderCells();
  for(let i=0;i<grid.length;i++){ if(grid[i].owner===0) grid[i].wall=false; }
  for(const idx of mainBorderCells){ grid[idx].wall=true; grid[idx].wallLevel=wallLevel; }
  needRender=true;
}

  for(let mi=0;mi<missiles.length;mi++){
    const m=missiles[mi]; if(m.exploded||m.isPlayer) continue;
    const id=m.id; const need=missileNeeds[id]||1; const hits=interceptHits[id]||0;
    if(hits>=need) continue;

function isBorderCell(idx,pid){ const c=grid[idx]; if(!c||c.owner!==pid) return false; for(const ni of c.neighbors){ if(grid[ni]&&(grid[ni].owner!==pid||grid[ni].owner===null)) return true; } return false; }
function isInnerCell(idx,pid){ const c=grid[idx]; if(!c||c.owner!==pid) return false; for(const ni of c.neighbors){ if(grid[ni]&&grid[ni].owner!==pid) return false; } return true; }

function innerCellsToCapital(pid){ const b=players[pid]; if(!b||!b.alive||b.capital===null) return; const ci=b.capital; for(let i=0;i<grid.length;i++){ if(i!==ci&&grid[i].owner===pid&&isInnerCell(i,pid)&&grid[i].troops>8){ const p=aStar(i,ci,pid); if(p&&p.length>=2&&grid[i].troops>4) moveTroopsAlongPath(p,pid,0.25); } } }
function innerCellsToBorders(pid){ const ic=[],bc=[]; for(let i=0;i<grid.length;i++){ if(grid[i].owner===pid&&isInnerCell(i,pid)&&grid[i].troops>8) ic.push(i); } if(ic.length===0) return; for(let i=0;i<grid.length;i++){ if(grid[i].owner===pid&&isBorderCell(i,pid)) bc.push({idx:i,troops:grid[i].troops}); } if(bc.length===0) return; bc.sort((a,b)=>a.troops-b.troops); let bi=0; for(const i of ic){ if(bi>=bc.length) bi=0; const p=aStar(i,bc[bi].idx,pid); if(p&&p.length>=2&&grid[i].troops>4){ moveTroopsAlongPath(p,pid,0.25); bi++; } } }
function findNearestNeutralBFS(pid){ const b=players[pid]; if(!b||!b.alive||b.capital===null) return null; const ci=b.capital,v=new Set([ci]),q=[{idx:ci,path:[ci]}]; while(q.length>0){ const{idx,path}=q.shift(),c=grid[idx]; if(!c) continue; for(const ni of c.neighbors){ if(v.has(ni)) continue; v.add(ni); const n=grid[ni]; if(!n) continue; if(n.owner===null){ let co=null,cd=Infinity; for(const n2 of grid[ni].neighbors){ if(grid[n2]&&grid[n2].owner===pid){ const d=distanceInCells(n2,ni); if(d<cd){ cd=d; co=n2; } } } if(co!==null) return {target:ni,origin:co}; const np=[...path,ni]; for(let i=np.length-2;i>=0;i--){ if(grid[np[i]].owner===pid&&grid[np[i]].troops>3) return {target:ni,origin:np[i]}; } return {target:ni,origin:ci}; } if(n.owner===pid||n.owner===null) q.push({idx:ni,path:[...path,ni]}); } } return null; }
function hasNeutralCells(){ for(let i=0;i<grid.length;i++){ if(grid[i].owner===null) return true; } return false; }
function findBestEnemyTarget(pid){ let bt=null,bs=-Infinity; for(let i=0;i<grid.length;i++){ const c=grid[i]; if(!c||c.owner===pid||c.owner===null) continue; let s=0; if(players[c.owner]&&players[c.owner].capital===i) s+=500; s-=c.troops*0.2; for(const ni of c.neighbors){ if(grid[ni]&&grid[ni].owner===pid){ s+=100; break; } } if(s>bs){ bs=s; bt=i; } } return bt; }
function findBestOrigin(ti,pid){ let bo=null,bs=-Infinity; for(let i=0;i<grid.length;i++){ const c=grid[i]; if(!c||c.owner!==pid||c.troops<3) continue; const p=aStar(i,ti,pid); if(!p||p.length<2) continue; const s=c.troops*2-p.length*3; if(s>bs){ bs=s; bo=i; } } return bo; }
function isCapitalUnderThreat(pid){ const b=players[pid]; if(!b||!b.alive||b.capital===null) return {underThreat:false,enemies:[],hnc:[]}; const ci=b.capital,c=grid[ci]; if(!c||c.owner!==pid) return {underThreat:false,enemies:[],hnc:[]}; const er=[],hnc=[]; for(let i=0;i<grid.length;i++){ const cl=grid[i]; if(!cl||cl.owner===null||cl.owner===pid) continue; const d=distanceInCells(i,ci); if(d<=CAPITAL_DEFENSE_DISTANCE) er.push({idx:i,troops:cl.troops,distance:d}); if(d<=4) hnc.push({idx:i,troops:cl.troops,distance:d}); } return {underThreat:er.length>0,enemies:er.sort((a,b)=>a.distance-b.distance),hostileNearCapital:hnc.sort((a,b)=>a.distance-b.distance)}; }
function reinforceCapitalViaPath(pid){ const b=players[pid]; if(!b||!b.alive||b.capital===null) return; const ci=b.capital; const s=[]; for(let i=0;i<grid.length;i++){ if(i!==ci&&grid[i].owner===pid&&grid[i].troops>15){ const d=distanceInCells(i,ci); if(d!==Infinity&&d>=2) s.push({idx:i,d}); } } s.sort((a,b)=>a.d-b.d); for(let i=0;i<Math.min(3,s.length);i++){ const p=aStar(s[i].idx,ci,pid); if(p&&p.length>=2) moveTroopsAlongPath(p,pid,0.10); } }
function destroyNearbyHostiles(pid,hostiles){ const b=players[pid]; if(!b||!b.alive||b.capital===null) return; const a=[]; for(let i=0;i<grid.length;i++){ if(grid[i].owner===pid&&grid[i].troops>4) a.push({idx:i,t:grid[i].troops}); } a.sort((a,b)=>b.t-a.t); const ta=a.slice(0,5); for(const h of hostiles){ for(const atk of ta){ if(grid[atk.idx].troops<3) continue; const p=aStar(atk.idx,h.idx,pid); if(p&&p.length>=2&&p.length<=6){ moveTroopsAlongPath(p,pid,0.95); break; } } } const cap=grid[b.capital]; if(cap&&cap.troops>20&&hostiles.length>0){ const p=aStar(b.capital,hostiles[0].idx,pid); if(p&&p.length>=2) moveTroopsAlongPath(p,pid,0.8); } }
function alertModeDefense(pid,enemies,hostiles){ const b=players[pid]; if(!b||!b.alive||b.capital===null) return; if(hostiles.length>0) destroyNearbyHostiles(pid,hostiles); const s=[]; for(let i=0;i<grid.length;i++){ if(i!==b.capital&&grid[i].owner===pid&&grid[i].troops>6){ const d=distanceInCells(i,b.capital); if(d!==Infinity&&d>=2) s.push({idx:i,d}); } } s.sort((a,b)=>a.d-b.d); for(let i=0;i<Math.min(4,s.length);i++){ const p=aStar(s[i].idx,b.capital,pid); if(p&&p.length>=2) moveTroopsAlongPath(p,pid,0.25); } for(let i=0;i<Math.min(3,enemies.length);i++){ const en=enemies[i]; let ba=null,bp=-Infinity; for(let j=0;j<grid.length;j++){ if(grid[j].owner===pid&&grid[j].troops>5){ const d=distanceInCells(j,en.idx); if(d!==Infinity&&d<=5){ const pw=grid[j].troops-d*2; if(pw>bp){ bp=pw; ba=j; } } } } if(ba!==null){ const p=aStar(ba,en.idx,pid); if(p&&p.length>=2) moveTroopsAlongPath(p,pid,0.9); } } const c=grid[b.capital]; if(c&&c.troops>20&&enemies.length>0){ const p=aStar(b.capital,enemies[0].idx,pid); if(p&&p.length>=2) moveTroopsAlongPath(p,pid,0.6); } }
function counterAttack(pid){ const be=[]; for(let i=0;i<grid.length;i++){ if(grid[i].owner===pid){ for(const ni of grid[i].neighbors){ if(grid[ni]&&grid[ni].owner!==null&&grid[ni].owner!==pid) be.push({e:ni,m:i,t:grid[ni].troops}); } } } be.sort((a,b)=>a.t-b.t); for(let i=0;i<Math.min(3,be.length);i++){ const t=be[i]; if(grid[t.m].troops>3){ const p=aStar(t.m,t.e,pid); if(p&&p.length>=2) moveTroopsAlongPath(p,pid,0.8); } } }
function attackOtherBots(pid){ const b=players[pid]; if(!b||!b.alive) return; let bt=null,bo=null,bs=-Infinity; const o=[]; for(let i=0;i<grid.length;i++){ if(grid[i].owner===pid&&grid[i].troops>5) o.push(i); } for(const oi of o){ for(const ni of grid[oi].neighbors){ if(grid[ni]&&grid[ni].owner!==null&&grid[ni].owner!==pid&&grid[ni].owner!==0){ let s=200-grid[ni].troops*0.3; if(players[grid[ni].owner]&&players[grid[ni].owner].capital===ni) s+=500; if(s>bs){ bs=s; bt=ni; bo=oi; } } } } if(bt!==null&&bo!==null){ const p=aStar(bo,bt,pid); if(p&&p.length>=2) moveTroopsAlongPath(p,pid,0.8); } }
function moveTroopsAlongPath(path,pid,ratio){ if(!path||path.length<2) return; for(let i=0;i<path.length-1;i++){ const from=path[i],to=path[i+1]; if(grid[from].owner!==pid) continue; if(grid[from].troops<2) continue; if(grid[to].owner!==pid&&grid[to].owner!==null){ if(grid[from].troops*ratio<grid[to].troops&&ratio<0.95) continue; } if(grid[to].owner===pid&&grid[to].troops>15&&ratio<0.9) continue; moveTroops(from,to,ratio); break; } }

function setupPlayers(n){ players=[]; const used=new Set(); const pool=['#3399ff','#ff5555','#ffe047','#8a60ff','#00c48c','#ff8800','#33ffaa','#aa33ff','#ff33aa']; for(let i=0;i<n;i++){ let c; do{c=pool[Math.floor(Math.random()*pool.length)];}while(used.has(c)); used.add(c); players.push({id:i,color:c,name:'لاعب '+(i+1),capital:null,alive:true}); } updateLegend(); needRender=true; }
function seedCapitals(){ if(!grid||grid.length===0) buildGrid(); grid.forEach(c=>{c.owner=null;c.troops=0;c.missileLauncher=false;c.wall=false;c.wallLevel=0;c.patriot=false;c.protectedByPatriot=false;}); const xs=grid.map(c=>c.x),ys=grid.map(c=>c.y),cxMin=Math.min(...xs),cxMax=Math.max(...xs),cyMin=Math.min(...ys),cyMax=Math.max(...ys); const corners=[[cxMin,cyMin],[cxMax,cyMin],[cxMin,cyMax],[cxMax,cyMax]]; for(let p=0;p<players.length;p++){ const pt=corners[p%corners.length]; let bi=0,bd=Infinity; for(let i=0;i<grid.length;i++){ const d=Math.hypot(grid[i].x-pt[0],grid[i].y-pt[1]); if(d<bd){ bd=d; bi=i; } } grid[bi].owner=players[p].id; grid[bi].troops=40; players[p].capital=bi; } needRender=true; }
function startProduction(ms){ if(prodTimer) clearInterval(prodTimer); prodTimer=setInterval(()=>{ if(grid&&grid.length) grid.forEach(c=>{ if(c.owner!=null) c.troops++; }); needRender=true; },Math.max(50,parseInt(ms,10)||900)); }
function moveTroops(fi,ti,ratio){
  if(!grid||!grid[fi]||!grid[ti]) return; const f=grid[fi],t=grid[ti]; const send=Math.floor(f.troops*ratio); if(send<=0) return;
  f.troops=Math.max(0,f.troops-send);
  if(t.owner===f.owner){ t.troops+=send; }
  else {
    let dm=1; if(t.wall&&t.wallLevel>0){ dm=1+(t.wallLevel*0.05); }
    const defenderPower=Math.floor(t.troops*dm);
    if(send>defenderPower){
      const survivor=send-defenderPower;
      const dfo=t.owner; t.owner=f.owner; t.troops=Math.max(1,survivor);
      if(dm>1){ const al=Math.floor(survivor*0.1*(dm-1)); t.troops=Math.max(1,survivor-al); }
      t.wall=false; t.wallLevel=0; t.patriot=false;
      if(dfo!=null&&players[dfo]&&players[dfo].capital===ti){
        players[dfo].alive=false;
        for(const c of grid){ if(c.owner===dfo){ c.owner=null; c.troops=0; c.missileLauncher=false; c.wall=false; c.patriot=false; c.protectedByPatriot=false; } }
        playEliminatedSound(); checkVictory();
      }
    } else {
      t.troops=Math.max(1,defenderPower-send);
      if(dm>1){ t.troops=Math.max(1,Math.floor(t.troops/dm)); }
    }
  }
  needRender=true;
}
function updateLeaderboard(){ if(!lbContent||!gameStarted) return; const stats=[]; for(let p=0;p<players.length;p++){ if(!players[p]||!players[p].alive) continue; let cc=0,tt=0; for(let i=0;i<grid.length;i++){ if(grid[i].owner===p){ cc++; tt+=grid[i].troops; } } stats.push({idx:p,name:players[p].name,color:players[p].color,cells:cc,troops:tt}); } stats.sort((a,b)=>b.cells-a.cells); let html=''; stats.forEach((s,i)=>{ const it=i===0; html+=`<div class="lb-row${it?' top1':''}"><span class="rank">${it?'👑':(i+1)}</span><span class="color-dot" style="background:${s.color}"></span><span class="info">${s.name}</span><span class="stats">${s.cells} محافظة | ${s.troops} جيش</span></div>`; }); if(stats.length===0) html='<div style="color:#93c5fd;text-align:center">لا يوجد لاعبين</div>'; lbContent.innerHTML=html; }
lbBtn.addEventListener('click',()=>{ if(lbPanel.style.display==='block'){ lbPanel.style.display='none'; return; } lbPanel.style.display='block'; updateLeaderboard(); });
function botEconomy(){ const bcc={}; for(let i=0;i<grid.length;i++){ const o=grid[i].owner; if(o!==null&&o!==0){ bcc[o]=(bcc[o]||0)+1; } } for(let p=1;p<players.length;p++){ if(!players[p]||!players[p].alive) continue; if(botCoins[p]===undefined) botCoins[p]=0; botCoins[p]+=(bcc[p]||0)*COINS_PER_CELL; if(botCoins[p]>=25000){ let built=false; for(let i=0;i<grid.length;i++){ if(grid[i].owner===p&&!grid[i].missileLauncher&&!isBorderCell(i,p)&&i!==players[p].capital){ grid[i].missileLauncher=true; botCoins[p]-=25000; built=true; break; } } if(!built){ for(let i=0;i<grid.length;i++){ if(grid[i].owner===p&&!grid[i].missileLauncher&&i!==players[p].capital){ grid[i].missileLauncher=true; botCoins[p]-=25000; break; } } } } } }
function botMissileAttack(now){ if(now-lastBotMissileTime<botMissileInterval) return; lastBotMissileTime=now; botMissileInterval=5000+Math.floor(Math.random()*10000); for(let p=1;p<players.length;p++){ if(!players[p]||!players[p].alive) continue; if(!botCoins[p]||botCoins[p]<1000) continue; const launchers=[]; for(let i=0;i<grid.length;i++){ if(grid[i].owner===p&&grid[i].missileLauncher) launchers.push(i); } if(launchers.length===0) continue; const sb=[],ct=[],ht=[]; const mc=new Set(); for(let i=0;i<grid.length;i++){ if(grid[i].owner===p) mc.add(i); } for(let i=0;i<grid.length;i++){ if(grid[i].owner===null||grid[i].owner===p) continue; let ia=false; for(const ni of grid[i].neighbors){ if(mc.has(ni)){ ia=true; break; } } if(ia) sb.push({idx:i,troops:grid[i].troops}); if(players[grid[i].owner]&&players[grid[i].owner].capital===i) ct.push({idx:i,troops:grid[i].troops}); ht.push({idx:i,troops:grid[i].troops}); } let target=null; const rand=Math.random(); if(rand<0.60&&sb.length>0){ target=sb[Math.floor(Math.random()*sb.length)].idx; } else if(rand<0.90&&ht.length>0){ ht.sort((a,b)=>b.troops-a.troops); target=ht[0].idx; } else if(ct.length>0){ ct.sort((a,b)=>b.troops-a.troops); target=ct[0].idx; } else if(sb.length>0){ target=sb[Math.floor(Math.random()*sb.length)].idx; } if(target!==null&&launchers.length>0){ botLaunchMissile(launchers[Math.floor(Math.random()*launchers.length)],target); } } }
function botTick(){ if(!grid||grid.length===0) return; botTickCounter++; const ne=hasNeutralCells(); const ts={}; for(let p=1;p<players.length;p++){ if(players[p]&&players[p].alive) ts[p]=isCapitalUnderThreat(p); } if(botTickCounter%3===0) botEconomy(); botMissileAttack(performance.now()); if(botTickCounter%10===0){ for(let p=1;p<players.length;p++){ if(players[p]&&players[p].alive) innerCellsToCapital(p); } } if(botTickCounter%5===0){ for(let p=1;p<players.length;p++){ if(players[p]&&players[p].alive) innerCellsToBorders(p); } } if(botTickCounter%3===0){ for(let p=1;p<players.length;p++){ if(players[p]&&players[p].alive) reinforceCapitalViaPath(p); } } for(let p=1;p<players.length;p++){ const bot=players[p]; if(!bot||!bot.alive) continue; const mt=ts[p],ia=mt&&mt.underThreat; if(ia&&botTickCounter%2===0) alertModeDefense(p,mt.enemies,mt.hostileNearCapital); else if(mt&&mt.hostileNearCapital.length>0&&botTickCounter%2===0) destroyNearbyHostiles(p,mt.hostileNearCapital); counterAttack(p); if(ne){ const nt=findNearestNeutralBFS(p); if(nt&&grid[nt.origin].troops>5){ const path=aStar(nt.origin,nt.target,p); if(path&&path.length>=2) moveTroopsAlongPath(path,p,0.5); } } attackOtherBots(p); const oi=grid.map((c,i)=>c.owner===p?i:null).filter(i=>i!==null); if(oi.length>0){ const bc=[]; for(const i of oi){ for(const n of grid[i].neighbors){ if(grid[n]&&grid[n].owner!==null&&grid[n].owner!==p){ bc.push({idx:i,threat:grid[n].troops}); break; } } } for(const b of bc){ if(grid[b.idx].troops>b.threat*0.5) continue; let bs2=null,bsc=-Infinity; for(const i of oi){ if(i===b.idx||grid[i].troops<10) continue; const path=aStar(i,b.idx,p); if(!path||path.length<2) continue; const sc=grid[i].troops-path.length*2; if(sc>bsc){ bsc=sc; bs2=i; } } if(bs2!==null){ const path=aStar(bs2,b.idx,p); if(path&&path.length>=2) moveTroopsAlongPath(path,p,0.5); } } } if(!ne){ const t=findBestEnemyTarget(p); if(t!==null){ const o=findBestOrigin(t,p); if(o!==null){ const path=aStar(o,t,p); if(path&&path.length>=2) moveTroopsAlongPath(path,p,0.6); } } } } if(botTickCounter%3===0) updateLeaderboard(); updatePatriotCoverage(); needRender=true; }
function drawCapitalMarker(ci){ if(!grid[ci]) return; const c=grid[ci],s=worldToScreen(c.x,c.y); ctx.beginPath(); ctx.lineWidth=Math.max(2,3*cam.scale); ctx.strokeStyle='rgba(255,215,0,0.95)'; ctx.arc(s.x,s.y,HEX*cam.scale+6*cam.scale,0,Math.PI*2); ctx.stroke(); ctx.fillStyle='rgba(255,215,0,0.95)'; ctx.font=(18*Math.max(0.7,cam.scale))+'px Tahoma'; ctx.textAlign='center'; ctx.fillText('★',s.x,s.y-(HEX*cam.scale+4*cam.scale)); }

function drawPatriotRadar(x,y,sc,isMain){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='#475569'; ctx.fillRect(-6*sc,-2*sc,12*sc,4*sc);
  ctx.fillStyle='#64748b'; ctx.fillRect(-5*sc,-3*sc,10*sc,2*sc);
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.5*sc; ctx.beginPath(); ctx.moveTo(0,-3*sc); ctx.lineTo(0,-10*sc); ctx.stroke();
  ctx.fillStyle='#cbd5e1'; ctx.beginPath(); ctx.ellipse(0,-10*sc,6*sc,3*sc,0,Math.PI,0); ctx.fill();
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1*sc; ctx.beginPath(); ctx.ellipse(0,-10*sc,6*sc,3*sc,0,0,Math.PI*2); ctx.stroke();
  if(isMain){ ctx.fillStyle='rgba(59,130,246,0.3)'; ctx.beginPath(); ctx.arc(0,-10*sc,4*sc,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(59,130,246,0.6)'; ctx.beginPath(); ctx.arc(0,-10*sc,1.5*sc,0,Math.PI*2); ctx.fill();
    const now=performance.now()*0.002; ctx.strokeStyle='rgba(59,130,246,0.4)'; ctx.lineWidth=0.8*sc;
    for(let i=0;i<3;i++){ const r=3+((now+i*1.5)%4)*1.5; ctx.beginPath(); ctx.arc(0,-10*sc,r*sc,0,Math.PI*2); ctx.stroke(); }
  }
  ctx.restore();
}

function render(){
  if(!ctx) return;
  if(Math.abs(cam.scale-cam.targetScale)>0.001){ cam.scale+=(cam.targetScale-cam.scale)*0.1; needRender=true; }
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H); ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,W,H); if(!grid||grid.length===0){ needRender=false; return; }
  for(let i=0;i<grid.length;i++){ 
    if(!grid[i]) continue;
    const c=grid[i],s=worldToScreen(c.x,c.y);
    if(!vn(s.x)||!vn(s.y)) continue;
    drawHex(s.x,s.y,HEX*cam.scale); ctx.fillStyle=c.owner==null?'#ffffff':players[c.owner]?players[c.owner].color:'#fff'; ctx.fill();
    if(i===selected){ ctx.strokeStyle='#00ff00'; ctx.lineWidth=3; ctx.stroke(); }
    ctx.fillStyle='#000'; ctx.textAlign='center'; ctx.font=(14*Math.max(0.7,cam.scale))+'px Tahoma'; ctx.fillText(c.troops,s.x,s.y+(5*cam.scale));
    if(c.missileLauncher){ ctx.fillStyle='#ff3333'; ctx.font='bold 22px Tahoma'; ctx.textAlign='center'; ctx.fillText('🚀',s.x-(c.patriot?18*cam.scale:0),s.y-(14*cam.scale)); }
    if(c.patriot){ drawPatriotRadar(s.x+(c.missileLauncher?14*cam.scale:0),s.y-(10*cam.scale),cam.scale,true); }
    else if(c.protectedByPatriot&&c.owner===0){ ctx.fillStyle='#60a5fa'; ctx.font=(10*Math.max(0.7,cam.scale))+'px Tahoma'; ctx.fillText('🛡️',s.x,s.y-(12*cam.scale)); }
  }
  drawWalls(); updateInterceptorMissiles(16); drawMissiles(); drawCellFires();
  for(const p of players){ if(p&&p.capital!=null&&p.alive) drawCapitalMarker(p.capital); }
  const now=performance.now();
  for(const p of players){ if(!p||p.capital==null||!p.alive) continue; const cap=grid[p.capital]; if(!cap) continue; let danger=false; for(let i=0;i<grid.length;i++){ const c=grid[i]; if(c.owner!=null&&c.owner!==p.id){ if(Math.hypot(c.x-cap.x,c.y-cap.y)<DEFEND_RADIUS){ danger=true; break; } } } if(danger){ const s=worldToScreen(cap.x,cap.y),blink=0.5+0.5*Math.sin(now*0.015); ctx.save(); ctx.translate(s.x,s.y-(HEX*cam.scale+18*cam.scale)); ctx.scale(cam.scale,cam.scale); ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(7,8); ctx.lineTo(-7,8); ctx.closePath(); ctx.fillStyle='rgba(255,80,80,'+blink+')'; ctx.fill(); ctx.restore(); } }
  needRender=false;
}

function updateLegend(){ if(!legendEl) return; legendEl.innerHTML=''; for(const p of players){ const d=document.createElement('div'); d.className='legend-item'; d.innerHTML=`<div style="width:14px;height:10px;background:${p.color};border-radius:4px"></div><div style="font-size:13px">${p.name}</div>`; legendEl.appendChild(d); } }
function checkVictory(){ if(!gameStarted) return; const alive=players.filter(p=>p&&p.alive); if(alive.length<=1){ const winner=alive[0]||players[0]; if(prodTimer) clearInterval(prodTimer); if(botTimer) clearInterval(botTimer); if(coinTimer) clearInterval(coinTimer); stopWallCheckInterval(); gameStarted=false; victoryText.textContent='الفائز هو:'; victorName.textContent=winner.name; victoryOverlay.style.display='flex'; lbPanel.style.display='none'; lbBtn.style.display='none'; coinDisplay.style.display='none'; hideBuildPanel(); hideLaunchButton(); legendEl.style.display='none'; playVictorySound(); } }
function returnToLobby(){ if(prodTimer) clearInterval(prodTimer); if(botTimer) clearInterval(botTimer); if(coinTimer) clearInterval(coinTimer); stopWallCheckInterval(); gameStarted=false; playerCoins=0; playerCellCount=0; wallLevel=0; victoryOverlay.style.display='none'; lbPanel.style.display='none'; lbBtn.style.display='none'; coinDisplay.style.display='none'; hideBuildPanel(); hideLaunchButton(); missiles=[]; cellFires=[]; interceptorMissiles=[]; botCoins={}; interceptHits={}; missileNeeds={}; legendEl.style.display='none'; document.getElementById('lobby').style.display='flex'; buildGrid(); setupPlayers(parseInt(playerCount.value,10)||4); seedCapitals(); render(); }
mainMenuBtn.addEventListener('click',returnToLobby); victoryToLobby.addEventListener('click',returnToLobby);
ratioSlider.addEventListener('input',e=>ratioValue.textContent=e.target.value+'%');
gameCanvas.addEventListener('pointerdown',e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; gameCanvas.setPointerCapture&&gameCanvas.setPointerCapture(e.pointerId); });
gameCanvas.addEventListener('pointerup',e=>{ dragging=false; gameCanvas.releasePointerCapture&&gameCanvas.releasePointerCapture(e.pointerId); });
gameCanvas.addEventListener('pointermove',e=>{ if(!dragging) return; cam.x+=(e.clientX-lastX)/cam.scale; cam.y+=(e.clientY-lastY)/cam.scale; lastX=e.clientX; lastY=e.clientY; needRender=true; });
gameCanvas.addEventListener('wheel',e=>{ e.preventDefault(); cam.targetScale=Math.max(0.3,Math.min(3,cam.targetScale*(e.deltaY<0?1.1:0.9))); needRender=true; },{passive:false});
let lpd=0;
gameCanvas.addEventListener('touchstart',e=>{ if(e.touches.length===2){ lpd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); } },{passive:false});
gameCanvas.addEventListener('touchmove',e=>{ if(e.touches.length===2){ e.preventDefault(); const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); if(lpd>0){ cam.targetScale=Math.max(0.3,Math.min(3,cam.targetScale*(d/lpd))); } lpd=d; needRender=true; } },{passive:false});
gameCanvas.addEventListener('touchend',()=>{ lpd=0; });
gameCanvas.addEventListener('click',e=>{ const pos=screenToWorld(e.clientX,e.clientY),idx=cellAt(pos.x,pos.y); if(idx==null){ if(!launchMode){ selected=null; hideBuildPanel(); hideLaunchButton(); needRender=true; } return; } const cell=grid[idx]; if(launchMode){ if(cell.owner!==null&&cell.owner!==0&&missileLauncherCell!==null){ launchMissile(missileLauncherCell,idx); } return; } if(selected===null){ if(cell.owner===0){ selected=idx; showBuildPanel(idx); if(cell.missileLauncher){ missileLauncherCell=idx; showLaunchButton(); } } else { selected=null; hideBuildPanel(); hideLaunchButton(); } } else { if(idx===selected){ selected=null; hideBuildPanel(); hideLaunchButton(); } else if(isNeighbor(selected,idx)){ moveTroops(selected,idx,ratioSlider?parseInt(ratioSlider.value,10)/100:0.5); selected=null; hideBuildPanel(); hideLaunchButton(); } else { selected=null; hideBuildPanel(); hideLaunchButton(); } } needRender=true; });

function startGame(){ try{ if(!grid||grid.length<8) buildGrid(); const cnt=Math.max(2,Math.min(4,parseInt(playerCount.value,10)||4)); setupPlayers(cnt); seedCapitals(); startProduction(parseInt(prodRate.value,10)||900); if(botTimer) clearInterval(botTimer); botTickCounter=0; botTimer=setInterval(botTick,900); playerCoins=0; playerCellCount=0; wallLevel=0; botCoins={}; lastBotMissileTime=0; botMissileInterval=5000+Math.floor(Math.random()*10000); if(coinTimer) clearInterval(coinTimer); coinTimer=setInterval(addCoins,1000); startWallCheckInterval(); startMusic(); document.getElementById('lobby').style.display='none'; lbPanel.style.display='none'; lbBtn.style.display='block'; coinDisplay.style.display='flex'; legendEl.style.display='flex'; hideBuildPanel(); hideLaunchButton(); missiles=[]; cellFires=[]; interceptorMissiles=[]; interceptHits={}; missileNeeds={}; updatePatriotCoverage(); launchMode=false; missileLauncherCell=null; selected=null; gameStarted=true; cam.targetScale=cam.scale; updateLegend(); focusOnPlayerCapital(); updateCoinDisplay(); needRender=true; }catch(err){ console.error(err); } }
startBtn.addEventListener('click',startGame); window.startGame=startGame;
let last=performance.now();
function frame(now){
  if(!gameStarted && !needRender && missiles.length===0 && cellFires.length===0 && interceptorMissiles.length===0){
    if(frameId) frameId=requestAnimationFrame(frame);
    return;
  }
  try{ render(); }catch(e){}
  last=now;
  if(frameId) frameId=requestAnimationFrame(frame);
}
frameId=requestAnimationFrame(frame);
buildGrid(); setupPlayers(4); seedCapitals(); needRender=true;
});
</script>
</body>
</html>
